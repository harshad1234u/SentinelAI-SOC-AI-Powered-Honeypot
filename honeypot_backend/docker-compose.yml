services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres, redis, qdrant]
    volumes: ["./data:/app/data"]

  rq-worker:
    build: .
    command: rq worker --url $REDIS_URL realtime-queue investigation-queue maintenance-queue
    env_file: .env
    depends_on: [postgres, redis, qdrant]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
        POSTGRES_USER: soc
        POSTGRES_PASSWORD: change-me-in-production
        POSTGRES_DB: honeypot_soc
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
