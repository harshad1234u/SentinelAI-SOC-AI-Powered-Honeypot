# Alembic configuration file.
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts — relative to this file
script_location = alembic

# Template used to generate migration files — see script.py.mako
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend — allows imports from app.*
prepend_sys_path = .

# Timezone for revision timestamps
# timezone =

# Max number of columns to display in offline mode
# max_length = 40

# The URL is overridden in env.py from app.core.config.Settings;
# this placeholder keeps "alembic check" happy.
sqlalchemy.url = postgresql+asyncpg://soc:change-me-in-production@localhost:5432/honeypot_soc

[post_write_hooks]
# Uncomment to auto-format migrations with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
